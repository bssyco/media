<div class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title">
                    <i class="fa fa-images me-1">
                    </i> {Title}
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="row px-3 pt-2">
                <div class="col-sm-8 media-new-folders d-flex flex-wrap gap-1 pb-1"></div>
                <div class="col-sm-4 pb-1">
                    <input type="text" class="form-control form-control-sm media-new-search" placeholder="{SearchPlaceholder}" />
                </div>
            </div>
            <div class="modal-body" style="min-height:340px;">
                <div class="media-new-grid"></div>
                <div class="media-new-empty" style="display:none;">
                    <i class="fa fa-folder2-open"></i>
                    {EmptyText}
                </div>
                <div class="media-new-loading" style="display:none;">
                    <i class="fa fa-arrows"></i>
                </div>
            </div>
            <div class="modal-footer py-2 d-flex justify-content-between">
                <div class="media-new-footer-info"></div>
                <div class="d-flex flex-wrap align-items-center gap-1">
                    <nav class=" pb-1">
                        <ul class="pagination pagination-sm mb-0 media-new-pagination"></ul>
                    </nav>
                    <button type="button" class="btn btn-sm btn-primary media-new-select pb-1" disabled> {SelectText}
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary pb-1" data-bs-dismiss="modal"> {CancelText}
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>
